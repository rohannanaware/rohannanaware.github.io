# ---- Edit these ----------------------------------------------------------
title: Rohan
tagline: Hey there! Welcome to my blog😊
description: >-
  Hiking and travel, short or long stories, data science and analytics, linux and raspberry-pi
  projects and some occassional musings
author: Rohan

url: "https://rohannanaware.github.io"
baseurl: ""

github_username: rohannanaware
# --------------------------------------------------------------------------

markdown: kramdown
highlighter: rouge
kramdown:
  input: GFM
  hard_wrap: false

# /hiking/my-post-title/
permalink: /:categories/:title/

plugins:
  - jekyll-feed
  - jekyll-seo-tag
  - jekyll-sitemap

defaults:
  - scope:
      path: ""
      type: posts
    values:
      layout: post

exclude:
  - README.md
  - tools
  - Gemfile
  - Gemfile.lock
  - vendor
  - node_modules
